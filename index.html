<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    .topic { display: inline-block; margin-bottom: .5rem; padding: .1rem .6rem; border-radius: 999px; background: #e8f0fe; font-weight: 600; }
    .manual { padding: .75rem 1rem; border-left: 4px solid #d97706; background: #fef3c7; }
    .invalid { padding: .75rem 1rem; border-left: 4px solid #dc2626; background: #fee2e2; }
    .draft { margin: 0; padding: .75rem 1rem; border-left: 4px solid #2563eb; background: #eff6ff; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };

    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const message = document.querySelector("#message");

    function renderReady(data) {
      const topic = TOPIC_LABELS[data.topic] ?? data.topic;
      const label = document.createElement("span");
      label.className = "topic";
      label.textContent = `Тема: ${topic}`;
      const draft = document.createElement("pre");
      draft.className = "draft";
      draft.textContent = data.draft;
      result.replaceChildren(label, draft);
    }

    function renderMessage(kind, text) {
      const block = document.createElement("p");
      block.className = kind;
      block.textContent = text;
      result.replaceChildren(block);
    }

    let currentRequest = null;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      currentRequest?.abort(); // новый сабмит отменяет предыдущий: старый ответ не должен перезаписать новый
      const request = currentRequest = new AbortController();

      renderMessage("", "Разбираем заявку…");

      let reply;
      try {
        reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: request.signal,
        });
      } catch (error) {
        if (error.name !== "AbortError") {
          renderMessage("invalid", "Сервер недоступен. Проверьте соединение и попробуйте ещё раз.");
        }
        return;
      }

      let data = null;
      try {
        data = await reply.json();
      } catch {
        // не-JSON тело (например, HTML-страница шлюза) — обработается ветками ниже
      }

      if (reply.ok && data?.status === "ready") {
        renderReady(data);
      } else if (data?.status === "manual_review") {
        renderMessage("manual", "Не удалось автоматически разобрать заявку. Черновик не подготовлен — обработайте заявку вручную.");
      } else if (reply.status === 400) {
        renderMessage("invalid", "Введите непустой текст заявки.");
      } else {
        renderMessage("invalid", "Сервер вернул ошибку. Попробуйте ещё раз.");
      }
    });
  </script>
</body>
</html>
